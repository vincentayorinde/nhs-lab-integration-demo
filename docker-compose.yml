# Local machine only. Not for public exposure or clinical deployment.
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in your local .env file}
    volumes:
      - genflow_sqlserver:/var/opt/mssql
    ports:
      - "127.0.0.1:1433:1433"
  api:
    build: .
    depends_on:
      - sqlserver
    environment:
      MSSQL_HOST: sqlserver
      MSSQL_PORT: 1433
      MSSQL_USER: sa
      MSSQL_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in your local .env file}
      PORT: 8080
    ports:
      - "127.0.0.1:8080:8080"
    restart: on-failure
volumes:
  genflow_sqlserver: