name: Verify lab workflow
on:
  push:
    branches: [main]
  pull_request:
jobs:
  domain-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: node --check docs/app.mjs
      - run: node --check api/server.mjs